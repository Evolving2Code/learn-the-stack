name: Generate snapshots

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated hash:slug pairs, e.g. "c174e3c:0004-link-home-to-about"'
        required: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: node scripts/snapshot.mjs ${{ github.event.inputs.targets }}

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots
          git commit -m "chore: generate snapshots [skip ci]" || echo "Nothing to commit"
          git push
